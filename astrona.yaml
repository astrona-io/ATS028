  title: 'CKAD: Application Observability and Maintenance'
  description: Detailed CKAD teaching with module playgrounds, guided hands-on practice
    and reusable YAML knowledge checks. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Application Developer
    code: CKAD
    provider: CNCF / Linux Foundation
    domain: Application Observability and Maintenance
    weight: 15
    competencies:
    - Understand API deprecations
    - Implement probes and health checks
    - Use built-in CLI tools to monitor Kubernetes applications
    - Utilize container logs
    - Debugging in Kubernetes
