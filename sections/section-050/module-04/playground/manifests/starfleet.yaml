apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    project: ckad
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    project: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet
data:
  server.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib import Path\nimport\
    \ os\nimport socket\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        marker\
    \ = {\"/ready\": \"/tmp/not-ready\", \"/health\": \"/tmp/unhealthy\"}.get(self.path)\n        status\
    \ = 503 if marker and Path(marker).exists() else 200\n        settings = Path(\"/settings/greeting\"\
    )\n        greeting = settings.read_text().strip() if settings.exists() else os.getenv(\"GREETING\"\
    , \"hello\")\n        body = f\"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()} greeting={greeting}\\\
    n\"\n        self.send_response(status)\n        self.send_header(\"Content-Type\", \"text/plain\"\
    )\n        self.end_headers()\n        self.wfile.write(body.encode())\n\nHTTPServer((\"0.0.0.0\"\
    , 8080), Handler).serve_forever()\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
      release: probe
  template:
    metadata:
      labels:
        app: probe
        release: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
    release: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensign
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ensign
  template:
    metadata:
      labels:
        app: ensign
    spec:
      containers:
        - name: main
          image: docker.io/library/busybox:1.37.99
          command: ["sh", "-c", "sleep 36000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadet
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadet
  template:
    metadata:
      labels:
        app: cadet
    spec:
      containers:
        - name: main
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "echo mode=$MODE; sleep 36000"]
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: cadet-settings
                  key: mode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: captain
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: captain
  template:
    metadata:
      labels:
        app: captain
    spec:
      containers:
        - name: main
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "sleep 36000"]
          resources:
            requests:
              cpu: "64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: main
          image: docker.io/library/python:3.13-alpine
          command: ["python", "-c", "x = b'x' * (150 * 1024 * 1024); import time; time.sleep(36000)"]
          resources:
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: main
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /www && echo bridge-ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: starfleet
spec:
  selector:
    app: bridge-app
  ports:
    - port: 80
      targetPort: 8080
