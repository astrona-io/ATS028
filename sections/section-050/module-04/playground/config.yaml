# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Diagnosing Failing Workloads From Status To Cause (PLAYGROUND). Ungraded environment: it
# starts, applies the starting manifests and stays running. No task and no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-028-playground-050-04
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deployment/probe
      namespace: starfleet
    - resource: deployment/bridge
      namespace: starfleet
    - resource: pod/shuttle
      namespace: starfleet
    - resource: pod/drifter
      namespace: outpost

teardown:
  keepCluster: false
