# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Migrate Ingress, CronJob, HorizontalPodAutoscaler And PodDisruptionBudget (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-028-lab-010-03-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

# Starting state: the running probe application and a ConfigMap that holds the
# legacy manifests. The learner writes the supported definitions.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the legacy manifests
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: ingress-migrated
      description: The Ingress probe-edge uses ingressClassName, pathType and a service backend
      type: file
      source: validation/validate-ingress-migrated.sh
      hint: In networking.k8s.io/v1 the backend is service.name and service.port.number, pathType is required and the class annotation becomes ingressClassName.
    - name: cronjob-migrated
      description: The CronJob shuttle-sweep is served by batch/v1 with its schedule and policy kept
      type: file
      source: validation/validate-cronjob-migrated.sh
      hint: Change apiVersion to batch/v1. The schedule, concurrencyPolicy and history limit must stay as in the legacy file.
    - name: hpa-migrated
      description: The HorizontalPodAutoscaler probe-scaler reads in autoscaling/v2 with a Utilization target of 55
      type: file
      source: validation/validate-hpa-migrated.sh
      hint: In autoscaling/v2 the target is target.type Utilization with target.averageUtilization.
    - name: pdb-migrated
      description: The PodDisruptionBudget probe-budget selects the probe pods and keeps minAvailable 1
      type: file
      source: validation/validate-pdb-migrated.sh
      hint: Change apiVersion to policy/v1 and keep the selector for app probe.
    - name: probe-still-serving
      description: The probe application still answers through its Service
      type: file
      source: validation/validate-probe-still-serving.sh
      hint: Do not change the probe Deployment or Service.

teardown:
  keepCluster: false
