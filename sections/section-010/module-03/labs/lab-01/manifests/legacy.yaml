apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-manifests
  namespace: starfleet
data:
  ingress.yaml: |
    apiVersion: extensions/v1beta1
    kind: Ingress
    metadata:
      name: probe-edge
      namespace: starfleet
      annotations:
        kubernetes.io/ingress.class: nginx
    spec:
      rules:
      - host: edge.starfleet.example
        http:
          paths:
          - path: /status
            backend:
              serviceName: probe
              servicePort: 80
  cronjob.yaml: |
    apiVersion: batch/v1beta1
    kind: CronJob
    metadata:
      name: shuttle-sweep
      namespace: starfleet
    spec:
      schedule: "*/10 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 2
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: sweep
                image: docker.io/library/busybox:1.37.0
                command: ["sh", "-c", "wget -q -T 3 -O- http://probe/"]
  hpa.yaml: |
    apiVersion: autoscaling/v2beta1
    kind: HorizontalPodAutoscaler
    metadata:
      name: probe-scaler
      namespace: starfleet
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: probe
      minReplicas: 2
      maxReplicas: 5
      metrics:
      - type: Resource
        resource:
          name: cpu
          targetAverageUtilization: 55
  pdb.yaml: |
    apiVersion: policy/v1beta1
    kind: PodDisruptionBudget
    metadata:
      name: probe-budget
      namespace: starfleet
    spec:
      minAvailable: 1
      selector:
        matchLabels:
          app: probe
