apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-manifests
  namespace: starfleet
data:
  ingress.yaml: |
    apiVersion: extensions/v1beta1
    kind: Ingress
    metadata:
      name: probe
      namespace: starfleet
      annotations:
        kubernetes.io/ingress.class: nginx
    spec:
      rules:
      - host: probe.starfleet.example
        http:
          paths:
          - path: /
            backend:
              serviceName: probe
              servicePort: 80
  cronjob.yaml: |
    apiVersion: batch/v1beta1
    kind: CronJob
    metadata:
      name: beacon-report
      namespace: starfleet
    spec:
      schedule: "*/5 * * * *"
      concurrencyPolicy: Forbid
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - name: report
                image: docker.io/library/busybox:1.37.0
                command: ["sh", "-c", "wget -q -T 3 -O- http://probe/"]
  hpa.yaml: |
    apiVersion: autoscaling/v2beta1
    kind: HorizontalPodAutoscaler
    metadata:
      name: probe
      namespace: starfleet
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: probe
      minReplicas: 2
      maxReplicas: 4
      metrics:
      - type: Resource
        resource:
          name: cpu
          targetAverageUtilization: 60
  pdb.yaml: |
    apiVersion: policy/v1beta1
    kind: PodDisruptionBudget
    metadata:
      name: probe
      namespace: starfleet
    spec:
      minAvailable: 1
      selector:
        matchLabels:
          app: probe
