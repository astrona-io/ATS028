apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle-reader
  namespace: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-manifests
  namespace: starfleet
data:
  role.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1beta1
    kind: Role
    metadata:
      name: probe-reader
      namespace: starfleet
    rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list"]
  rolebinding.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1beta1
    kind: RoleBinding
    metadata:
      name: probe-reader
      namespace: starfleet
    subjects:
    - kind: ServiceAccount
      name: shuttle-reader
      namespace: starfleet
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: probe-reader
  priorityclass.yaml: |
    apiVersion: scheduling.k8s.io/v1beta1
    kind: PriorityClass
    metadata:
      name: fleet-important
    value: 100000
    globalDefault: false
    description: Workloads that must be scheduled before routine work.
  ingress.yaml: |
    apiVersion: extensions/v1beta1
    kind: Ingress
    metadata:
      name: probe
      namespace: starfleet
    spec:
      rules:
      - host: probe.starfleet.example
        http:
          paths:
          - path: /
            backend:
              serviceName: probe
              servicePort: 80
