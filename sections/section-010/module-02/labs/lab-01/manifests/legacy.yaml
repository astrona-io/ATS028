apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout-reader
  namespace: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-manifests
  namespace: starfleet
data:
  role.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1beta1
    kind: Role
    metadata:
      name: scout-reader
      namespace: starfleet
    rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list"]
  rolebinding.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1beta1
    kind: RoleBinding
    metadata:
      name: scout-reader
      namespace: starfleet
    subjects:
    - kind: ServiceAccount
      name: scout-reader
      namespace: starfleet
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: scout-reader
  priorityclass.yaml: |
    apiVersion: scheduling.k8s.io/v1beta1
    kind: PriorityClass
    metadata:
      name: fleet-critical
    value: 900000
    globalDefault: false
    description: Workloads that must be scheduled before routine work.
