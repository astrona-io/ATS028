apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scout-reader
  namespace: starfleet
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scout-reader
  namespace: starfleet
subjects:
- kind: ServiceAccount
  name: scout-reader
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scout-reader
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: fleet-critical
value: 900000
globalDefault: false
description: Workloads that must be scheduled before routine work.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-findings
  namespace: starfleet
data:
  role: rbac.authorization.k8s.io/v1
  priorityclass: scheduling.k8s.io/v1
  ingress: networking.k8s.io/v1
