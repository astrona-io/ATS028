apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    project: ckad
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    project: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from pathlib import Path
    import os
    import socket
    import time

    time.sleep(int(os.getenv("START_DELAY", "0")))


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            marker = {"/ready": "/tmp/not-ready", "/health": "/tmp/unhealthy"}.get(self.path)
            status = 503 if marker and Path(marker).exists() else 200
            if self.path not in ("/", "/ready", "/health"):
                status = 404
            body = "version=%s host=%s path=%s\n" % (os.getenv("VERSION", "v1"), socket.gethostname(), self.path)
            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    print("listening on 8080", flush=True)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 36000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: web
          image: docker.io/library/python:3.13-alpine
          command: ["python", "/app/server.py"]
          env:
            - name: VERSION
              value: v1

          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      containers:
        - name: web
          image: docker.io/library/python:3.13-alpine
          command: ["python", "/app/server.py"]
          env:
            - name: VERSION
              value: v1
            - name: START_DELAY
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: slow
  namespace: starfleet
spec:
  selector:
    app: slow
  ports:
    - name: http
      port: 80
      targetPort: http
