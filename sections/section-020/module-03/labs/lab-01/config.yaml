# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Size A Startup Probe (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-028-lab-020-03-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

# The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: startup-probe
      description: "beacon has a startup probe on port 8080 with a budget of 60 to 300 seconds"
      type: file
      source: validation/validate-startup-probe.sh
      hint: "Add startupProbe with an httpGet on /health or /ready, periodSeconds 5 and failureThreshold 24."
    - name: liveness-kept-fast
      description: "The liveness probe is kept, with a period of 10 seconds or less and at most 3 failures"
      type: file
      source: validation/validate-liveness-kept-fast.sh
      hint: "Do not weaken liveness to survive the start. Keep periodSeconds at 10 or less and failureThreshold at 3 or less."
    - name: beacon-stable
      description: "beacon has 2 ready replicas and no restarts"
      type: file
      source: validation/validate-beacon-stable.sh
      hint: "After the patch wait for the rollout. New pods must start without restarts."
    - name: budget-recorded
      description: "The ConfigMap probe-budget records the startup budget in seconds"
      type: file
      source: validation/validate-budget-recorded.sh
      hint: "Create the ConfigMap probe-budget in starfleet with key startup-seconds set to failureThreshold times periodSeconds."
    - name: beacon-serving
      description: "beacon answers through its Service"
      type: file
      source: validation/validate-beacon-serving.sh
      hint: "Do not change labels, ports or the Service."

teardown:
  keepCluster: false
