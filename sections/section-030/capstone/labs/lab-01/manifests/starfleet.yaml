---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  namespace: starfleet
  labels:
    app: keel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keel
  template:
    metadata:
      labels:
        app: keel
        tier: data
        env: prod
    spec:
      containers:
        - name: main
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
