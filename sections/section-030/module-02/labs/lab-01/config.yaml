# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Select And Report Workloads (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-028-lab-030-02-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

# The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: web-pods-recorded
      description: The ConfigMap findings key web-pods lists the production web pods
      type: file
      source: validation/validate-web-pods-recorded.sh
      hint: Use a label selector with two labels and print only the names.
    - name: images-recorded
      description: The ConfigMap findings key images lists the distinct container images in starfleet
      type: file
      source: validation/validate-images-recorded.sh
      hint: Use -o jsonpath over all pods, then sort and de-duplicate.
    - name: completed-pod-recorded
      description: The ConfigMap findings key completed-pod names the pod that finished
      type: file
      source: validation/validate-completed-pod-recorded.sh
      hint: Use a field selector on status.phase.
    - name: web-pods-labeled
      description: Every production web pod carries the label reviewed=true and no other pod does
      type: file
      source: validation/validate-web-pods-labeled.sh
      hint: Use kubectl label with the same selector you used to find them.
    - name: app-still-serving
      description: The probe application still answers through its Service
      type: file
      source: validation/validate-app-still-serving.sh
      hint: Do not delete or scale the Deployments.

teardown:
  keepCluster: false
